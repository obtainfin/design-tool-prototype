<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Habit Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d2e;
      --surface2: #252840;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --green: #43e97b;
      --text: #e2e8f0;
      --muted: #8892a4;
      --radius: 14px;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }

    #date-display {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      max-width: 560px;
      margin: 0 auto 20px;
    }

    /* Progress Summary */
    #summary {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    #progress-circle {
      flex-shrink: 0;
      width: 80px;
      height: 80px;
    }

    #progress-circle circle {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
    }

    #circle-track { stroke: var(--surface2); }
    #circle-fill {
      stroke: var(--green);
      stroke-dasharray: 201;
      stroke-dashoffset: 201;
      transition: stroke-dashoffset 0.6s ease;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    #circle-label {
      font-size: 13px;
      font-weight: 700;
      fill: var(--text);
      dominant-baseline: middle;
      text-anchor: middle;
    }

    #summary-text h2 { font-size: 1.1rem; margin-bottom: 4px; }
    #summary-text p { font-size: 0.85rem; color: var(--muted); }

    /* Add Habit Form */
    .add-form {
      display: flex;
      gap: 10px;
    }

    .add-form input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .add-form input:focus { border-color: var(--accent); }
    .add-form input::placeholder { color: var(--muted); }

    .add-form button {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 11px 20px;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: 700;
      transition: opacity 0.2s, transform 0.1s;
    }

    .add-form button:hover { opacity: 0.85; }
    .add-form button:active { transform: scale(0.96); }

    /* Habit List */
    #habit-list { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

    .habit-item {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1.5px solid transparent;
      transition: border-color 0.2s, background 0.2s;
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .habit-item.done {
      border-color: var(--green);
      background: rgba(67, 233, 123, 0.07);
    }

    .check-btn {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 2.5px solid var(--muted);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      color: transparent;
    }

    .habit-item.done .check-btn {
      border-color: var(--green);
      background: var(--green);
      color: white;
      transform: scale(1.1);
    }

    .habit-info { flex: 1; min-width: 0; }
    .habit-name {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .habit-item.done .habit-name { text-decoration: line-through; color: var(--muted); }

    .streak-badge {
      font-size: 0.75rem;
      margin-top: 3px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .streak-badge.hot { color: #f97316; }

    .delete-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
      line-height: 1;
    }

    .delete-btn:hover { color: var(--accent2); background: rgba(255,101,132,0.1); }

    /* Empty state */
    #empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      display: none;
    }

    #empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    #empty-state p { font-size: 0.95rem; line-height: 1.6; }

    /* Motivational quote */
    #quote-card {
      max-width: 560px;
      margin: 0 auto 20px;
      text-align: center;
      padding: 16px 20px;
      background: linear-gradient(135deg, rgba(108,99,255,0.15), rgba(255,101,132,0.15));
      border-radius: var(--radius);
      border: 1px solid rgba(108,99,255,0.2);
    }

    #quote-card p {
      font-size: 0.85rem;
      color: var(--muted);
      font-style: italic;
      line-height: 1.5;
    }

    /* Celebrate animation */
    @keyframes pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.18); }
      70%  { transform: scale(0.94); }
      100% { transform: scale(1); }
    }

    .pop { animation: pop 0.35s ease; }
  </style>
</head>
<body>

  <header>
    <h1>Daily Habit Tracker</h1>
    <div id="date-display"></div>
  </header>

  <div class="card" id="summary-card">
    <div id="summary">
      <svg id="progress-circle" viewBox="0 0 80 80">
        <circle id="circle-track" cx="40" cy="40" r="32"/>
        <circle id="circle-fill"  cx="40" cy="40" r="32"/>
        <text id="circle-label"   x="40" y="40">0%</text>
      </svg>
      <div id="summary-text">
        <h2 id="summary-title">Start your day!</h2>
        <p id="summary-sub">Add habits below and check them off as you go.</p>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="add-form">
      <input id="new-habit-input" type="text" placeholder="Add a new habit (e.g. Drink water, Read 10 pages)…" maxlength="60"/>
      <button onclick="addHabit()" title="Add habit">+</button>
    </div>
  </div>

  <div id="quote-card">
    <p id="quote-text"></p>
  </div>

  <div id="habit-list">
    <div id="empty-state">
      <div class="icon">🌱</div>
      <p>No habits yet.<br>Add one above to start building your best self.</p>
    </div>
  </div>

  <script>
    const QUOTES = [
      "We are what we repeatedly do. Excellence is not an act, but a habit. — Aristotle",
      "Motivation gets you started. Habit keeps you going. — Jim Ryun",
      "Small daily improvements lead to stunning long-term results.",
      "You don't rise to the level of your goals. You fall to the level of your systems. — James Clear",
      "The secret of your future is hidden in your daily routine. — Mike Murdock",
      "Success is the sum of small efforts repeated day in and day out. — R. Collier",
      "Chains of habit are too light to be felt until they are too heavy to be broken. — Warren Buffett",
    ];

    const TODAY = new Date().toISOString().slice(0, 10);

    function load() {
      return JSON.parse(localStorage.getItem('habits_v1') || '[]');
    }

    function save(habits) {
      localStorage.setItem('habits_v1', JSON.stringify(habits));
    }

    function todayKey() { return TODAY; }

    function addHabit() {
      const input = document.getElementById('new-habit-input');
      const name = input.value.trim();
      if (!name) return;

      const habits = load();
      habits.push({ id: Date.now(), name, completedDates: [], streak: 0, lastCompleted: null });
      save(habits);
      input.value = '';
      render();
    }

    function toggleHabit(id) {
      const habits = load();
      const h = habits.find(x => x.id === id);
      if (!h) return;

      const already = h.completedDates.includes(TODAY);
      if (already) {
        h.completedDates = h.completedDates.filter(d => d !== TODAY);
        // Recalculate streak
        h.streak = calcStreak(h.completedDates);
      } else {
        h.completedDates.push(TODAY);
        h.streak = calcStreak(h.completedDates);
        h.lastCompleted = TODAY;
      }
      save(habits);
      render();

      if (!already) {
        const el = document.getElementById('habit-' + id);
        if (el) { el.classList.add('pop'); el.addEventListener('animationend', () => el.classList.remove('pop'), {once:true}); }
      }
    }

    function deleteHabit(id) {
      const habits = load().filter(h => h.id !== id);
      save(habits);
      render();
    }

    function calcStreak(dates) {
      if (!dates.length) return 0;
      const sorted = [...dates].sort().reverse();
      const msDay = 86400000;
      let streak = 0;
      let cursor = new Date(TODAY).getTime();
      for (const d of sorted) {
        const t = new Date(d).getTime();
        if (t === cursor || t === cursor - msDay * streak) {
          if (t === cursor - msDay * streak) { streak++; }
          else if (streak === 0) { streak = 1; }
        } else {
          break;
        }
      }
      // simpler O(n) approach
      return calcStreakSimple(dates);
    }

    function calcStreakSimple(dates) {
      if (!dates.length) return 0;
      const set = new Set(dates);
      let streak = 0;
      let cursor = new Date(TODAY);
      // check if completed today; if not, start from yesterday
      if (!set.has(fmt(cursor))) {
        cursor.setDate(cursor.getDate() - 1);
      }
      while (set.has(fmt(cursor))) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      }
      return streak;
    }

    function fmt(d) { return d.toISOString().slice(0, 10); }

    function render() {
      const habits = load();
      const list = document.getElementById('habit-list');
      const empty = document.getElementById('empty-state');

      // Remove old habit items (keep empty state node)
      [...list.querySelectorAll('.habit-item')].forEach(el => el.remove());

      if (!habits.length) {
        empty.style.display = 'block';
        updateProgress(0, 0);
        return;
      }
      empty.style.display = 'none';

      let doneCount = 0;
      habits.forEach(h => {
        const done = h.completedDates.includes(TODAY);
        if (done) doneCount++;

        const item = document.createElement('div');
        item.className = 'habit-item' + (done ? ' done' : '');
        item.id = 'habit-' + h.id;

        const streakHot = h.streak >= 3;
        const streakIcon = h.streak >= 7 ? '🔥' : h.streak >= 3 ? '⚡' : '✦';

        item.innerHTML = `
          <button class="check-btn" onclick="toggleHabit(${h.id})" title="${done ? 'Uncheck' : 'Mark done'}">${done ? '✓' : ''}</button>
          <div class="habit-info">
            <div class="habit-name">${escHtml(h.name)}</div>
            <div class="streak-badge${streakHot ? ' hot' : ''}">
              ${streakIcon} ${h.streak} day streak
            </div>
          </div>
          <button class="delete-btn" onclick="deleteHabit(${h.id})" title="Remove habit">✕</button>
        `;
        list.appendChild(item);
      });

      updateProgress(doneCount, habits.length);
    }

    function updateProgress(done, total) {
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      const circumference = 2 * Math.PI * 32; // r=32 → ~201
      const offset = circumference - (pct / 100) * circumference;

      document.getElementById('circle-fill').style.strokeDashoffset = offset;
      document.getElementById('circle-label').textContent = pct + '%';

      const title = document.getElementById('summary-title');
      const sub = document.getElementById('summary-sub');

      if (total === 0) {
        title.textContent = 'Start your day!';
        sub.textContent = 'Add habits below and check them off as you go.';
      } else if (done === 0) {
        title.textContent = "Let's go!";
        sub.textContent = `0 of ${total} habits done today.`;
      } else if (done === total) {
        title.textContent = '🎉 All done!';
        sub.textContent = `Perfect day — all ${total} habits completed!`;
      } else {
        title.textContent = `${done} of ${total} done`;
        sub.textContent = `${total - done} habit${total - done > 1 ? 's' : ''} left for today.`;
      }
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Setup
    document.getElementById('date-display').textContent = new Date().toLocaleDateString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });

    document.getElementById('quote-text').textContent =
      QUOTES[new Date().getDay() % QUOTES.length];

    document.getElementById('new-habit-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') addHabit();
    });

    // Seed starter habits if first time
    if (!localStorage.getItem('habits_v1')) {
      const starters = ['Drink 8 glasses of water', 'Exercise for 20 min', 'Read for 15 min'];
      const habits = starters.map((name, i) => ({
        id: Date.now() + i, name, completedDates: [], streak: 0, lastCompleted: null
      }));
      save(habits);
    }

    render();
  </script>
</body>
</html>
